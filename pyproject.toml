[project]
name = "tarefas-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.118",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "pydantic-settings>=2.7",
]

[project.optional-dependencies]
dev = [
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "uvicorn[standard]>=0.34",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]